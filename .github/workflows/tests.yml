name: PHP checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        database: ["mysql:8.0", "mariadb:10.11", "mariadb:10.4"]
    services:
      database:
        image: ${{ matrix.database }}
        env:
          MYSQL_DATABASE: parkir_test
          MYSQL_ROOT_PASSWORD: ci-test-only
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent -h 127.0.0.1 -pci-test-only"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: intl, mbstring, mysqli, dom, xml, xmlwriter
          coverage: none
      - name: Configure test database
        run: |
          cat > .env <<'ENV'
          database.tests.hostname = 127.0.0.1
          database.tests.database = parkir_test
          database.tests.username = root
          database.tests.password = ci-test-only
          database.tests.port = 3306
          ENV
      - run: composer install --no-interaction --prefer-dist
      - run: composer validate --strict
      - run: composer lint
      - run: composer test
